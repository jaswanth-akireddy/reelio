# Reelio settings. Secrets (API keys) never go here; they live in GitHub → Settings → Secrets.
channel:
  handle: "@yourhandle"            # shown as watermark and on the end card
  series: "CARS {EXPLAINED}"        # end-card title; {..} is highlighted in yellow
  series_sub: "follow for more"
  language: "Telugu"                # narration language
  caption_style: "Romanized Telugu (Tenglish), like 'Meeku thelusaa?'"
  audience: "Young Telugu-speaking car and bike fans in Andhra Pradesh and Telangana"

schedule:
  ideas_hour_ist: 9                 # ideas arrive on Telegram at this hour (IST) if no run is open

llm:
  provider: "claude_code"           # "claude_code" (your Claude Pro plan, CLAUDE_CODE_OAUTH_TOKEN),
                                    # "gemini" (GEMINI_API_KEY) or "claude" (paid API, ANTHROPIC_API_KEY)
  claude_code_model: "sonnet"
  gemini_model: "gemini-3.8-flash"
  gemini_fallback: "gemini-3.5-flash-lite"   # used if the main model is busy or over the free limit
  claude_model: "claude-opus-5-5"
  web_search: true                  # lets the AI check facts with web search while writing the script

voice:
  provider: "elevenlabs"
  voice_id: "nPczCjzI2devNBz1zQrb"   # "Brian", a built-in voice the free plan can use through the API
  # your Voice Library pick (needs a paid plan for API use): "nbCEMhgrRe2fw9nGq2Ma"
  fallback_voice_id: "nPczCjzI2devNBz1zQrb"   # used automatically if a voice needs a paid plan
  model_id: "eleven_v4"             # Telugu needs eleven_v4 or eleven_v3
  stability: 0.45
  similarity_boost: 0.8
  speed: 1.05

video:
  target_seconds: 55                # aim; the voice decides the final length
  music_volume: 0.16                # background music level under the voice
  render_workers: 4

publish:
  youtube: true                     # needs YOUTUBE_* secrets; skipped if they are missing
  youtube_privacy: "public"         # or "private" / "unlisted" while testing
  instagram: false                  # coming next
